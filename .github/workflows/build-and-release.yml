name: Build and Release Custom Boot Image

on:
  push:
    branches:
      - nitro-lineage-23.2
  schedule:
    # Daily at 06:00 UTC - checks for a newer official LineageOS build
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if the LineageOS build has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  DEVICE: pioneer

jobs:
  check:
    name: Check for New LineageOS Build
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      lineage_date: ${{ steps.lineage.outputs.date }}
      lineage_version: ${{ steps.lineage.outputs.version }}
      boot_url: ${{ steps.lineage.outputs.boot_url }}
      last_release_date: ${{ steps.last.outputs.date }}

    steps:
      - name: Query LineageOS API for the latest official build
        id: lineage
        run: |
          set -euo pipefail
          API_URL="https://download.lineageos.org/api/v2/devices/${DEVICE}/builds"
          # The API returns builds newest-first, so .[0] is the latest one.
          BUILD=$(curl -sSfL "$API_URL" | jq -c '.[0]')

          DATE=$(echo "$BUILD" | jq -r '.date')
          VERSION=$(echo "$BUILD" | jq -r '.version')
          BOOT_URL=$(echo "$BUILD" | jq -r '.files[] | select(.filename == "boot.img") | .url')

          if [ -z "$DATE" ] || [ "$DATE" = "null" ] || [ -z "$BOOT_URL" ] || [ "$BOOT_URL" = "null" ]; then
            echo "::error::Could not resolve the latest LineageOS build for ${DEVICE}"
            exit 1
          fi

          echo "Latest official build: $VERSION / $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "boot_url=$BOOT_URL" >> "$GITHUB_OUTPUT"

      - name: Read the LineageOS date recorded in the last release
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # /releases/latest skips prereleases, so use the plain list (newest first).
          BODY=$(curl -sSfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=1" \
            | jq -r '.[0].body // ""')

          DATE=$(echo "$BODY" | grep -oP '^LineageOS-Build:\s*\K[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)
          echo "Last released LineageOS build: ${DATE:-<none>}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          LINEAGE_DATE: ${{ steps.lineage.outputs.date }}
          LAST_DATE: ${{ steps.last.outputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          SHOULD=false
          case "$GITHUB_EVENT_NAME" in
            push)
              # Kernel source changed - always rebuild.
              SHOULD=true
              ;;
            workflow_dispatch)
              if [ "$FORCE" = "true" ] || [ "$LINEAGE_DATE" != "$LAST_DATE" ]; then
                SHOULD=true
              fi
              ;;
            schedule)
              if [ "$LINEAGE_DATE" != "$LAST_DATE" ]; then
                SHOULD=true
              fi
              ;;
          esac

          echo "event=$GITHUB_EVENT_NAME lineage=$LINEAGE_DATE last=$LAST_DATE -> should_build=$SHOULD"
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD" = "false" ]; then
            echo "### No new LineageOS build (still \`$LINEAGE_DATE\`) - skipping build" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build Kernel and Repack Boot
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: nitro-lineage-23.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev zip curl jq unzip python3 git bison flex cpio gcc-aarch64-linux-gnu

      - name: Fetch Magisk 26.4 & Extract magiskboot (x86_64)
        run: |
          echo "--- Downloading Latest Magisk ---"
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v26.4/Magisk-v26.4.apk"

          echo "Downloading: $MAGISK_URL"
          curl -L -o magisk.apk "$MAGISK_URL"
          unzip -o -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .

          echo "--- Extracted magiskboot ---"

          find . -name "libmagiskboot.so" -exec sh -c 'mv "$0" "${0%/*}/magiskboot"' {} \;
          chmod 755 magiskboot

          echo "--- magiskboot ready ---"

          ls -l magiskboot

      - name: Fetch Latest LineageOS boot.img
        run: |
          echo "--- Downloading LineageOS boot.img (${{ needs.check.outputs.lineage_date }}) ---"
          curl -L -o boot.img "${{ needs.check.outputs.boot_url }}"

      - name: Unpack Boot Image
        run: |
          echo "--- Preparing Environment for Repacking ---"

          sudo mkdir -p /mnt/ramdisk
          sudo mount -t tmpfs -o size=256M tmpfs /mnt/ramdisk

          sudo chown $USER:$USER /mnt/ramdisk

          mv boot.img /mnt/ramdisk/
          mv magiskboot /mnt/ramdisk/

          cd /mnt/ramdisk

          # Unpack the original boot image
          ./magiskboot unpack boot.img

      - name: Compile Kernel (build.sh)
        run: |
          cp /mnt/ramdisk/kernel ./kernel-old
          chmod +x ./build.sh
          USE_CCACHE=0 ./build.sh

      - name: Resolve Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREFIX="v$(date -u +%Y.%m.%d)"

          # Collect every tag already used today (releases + plain tags) and
          # take the highest trailing counter, so same-day rebuilds bump .0 -> .1 -> .2 ...
          TAGS=$( { curl -sSfL \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                    | jq -r '.[].tag_name'
                    curl -sSfL \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
                    | jq -r '.[].name'
                  } | sort -u )

          NEXT=0
          while read -r t; do
            case "$t" in
              "$PREFIX".*) ;;
              *) continue ;;
            esac
            N="${t##*.}"
            case "$N" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$((N + 1))" -gt "$NEXT" ]; then
              NEXT=$((N + 1))
            fi
          done <<< "$TAGS"

          TAG="${PREFIX}.${NEXT}"
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Repack Boot Image
        run: |
          echo "--- Packing New Boot Image ---"
          mv out/arch/arm64/boot/Image /mnt/ramdisk/kernel

          cd /mnt/ramdisk
          ./magiskboot repack boot.img new-boot.img

          # Name the final boot image after the release tag
          FINAL="boot-nitro-${DEVICE}-${{ steps.tag.outputs.tag }}.img"
          mv new-boot.img "$GITHUB_WORKSPACE/$FINAL"

          cd $GITHUB_WORKSPACE
          sudo umount /mnt/ramdisk
          echo "FINAL_BOOT=$FINAL" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: ${{ env.FINAL_BOOT }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Nitro Kernel ${{ steps.tag.outputs.tag }}"
          # The LineageOS-Build line is machine-read by the scheduled check job.
          # Keep it as the first line and do not change its format.
          body: |
            LineageOS-Build: ${{ needs.check.outputs.lineage_date }}

            Automated boot.img build with the Nitro custom kernel.

            - LineageOS version: ${{ needs.check.outputs.lineage_version }}
            - Official build date: ${{ needs.check.outputs.lineage_date }}
            - Kernel commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
